<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CipherChat</title>
<style>
  :root{--bg:#0b1014;--panel:#121a21;--line:#1f2b34;--txt:#e6edf3;--mut:#8b9aa7;--acc:#10b981;--me:#0f6b55;--warn:#f5b942}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(380px,92vw)}
  h1{margin:0 0 4px;font-size:22px} p.sub{margin:0 0 18px;color:var(--mut);font-size:14px}
  input,select,button{font:inherit;color:var(--txt);background:#0d141a;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  button{cursor:pointer} button.primary{background:var(--acc);color:#04130d;font-weight:600;border:none}
  label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
  .full{width:100%}
  #app{display:none;width:min(1000px,98vw);height:94vh;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;grid-template-columns:230px 1fr}
  aside{border-right:1px solid var(--line);padding:16px;overflow:auto}
  aside h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
  .user{padding:6px 0;font-size:14px}.user::before{content:"● ";color:var(--acc)}
  main{display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .bar input{width:130px}
  .bar label{margin:0}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .sys{align-self:center;font-size:12px;color:var(--mut);background:#0d141a;padding:4px 12px;border-radius:99px}
  .msg{max-width:75%;padding:8px 12px;border-radius:12px;background:#1a252e;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:var(--me)}
  .msg .who{font-size:12px;color:var(--acc);margin-bottom:2px}
  .msg .wire{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed #ffffff30;font:12px ui-monospace,monospace;color:var(--warn);word-break:break-all}
  body.showwire .msg .wire{display:block}
  .msg .time{font-size:10px;color:var(--mut);text-align:right}
  #typing{height:18px;padding:0 16px;font-size:12px;color:var(--mut)}
  .send{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .send input{flex:1}
  #preview{padding:0 16px 8px;font:12px ui-monospace,monospace;color:var(--warn);min-height:20px}
  @media(max-width:700px){#app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="card" id="login">
  <h1>🔐 CipherChat</h1>
  <p class="sub">Chat where every message is encrypted with a substitution cipher before it leaves your device.</p>
  <label>Username</label><input class="full" id="name" placeholder="e.g. Rahul" maxlength="20">
  <label>Cipher</label>
  <select class="full" id="cipherL"><option value="caesar">Caesar (shift number)</option><option value="vigenere">Vigenère (keyword)</option><option value="mono">Monoalphabetic (keyword)</option></select>
  <label>Shared secret key</label><input class="full" id="keyL" placeholder="e.g. 5 or SECRET">
  <br><br><button class="primary full" id="join">Join chat</button>
  <p class="sub" style="margin-top:14px;font-size:12px">Both people must use the same cipher and key, otherwise messages decrypt to gibberish.</p>
</div>

<div id="app">
  <aside><h3>Online</h3><div id="users"></div></aside>
  <main>
    <div class="bar">
      <select id="cipher"><option value="caesar">Caesar</option><option value="vigenere">Vigenère</option><option value="mono">Monoalphabetic</option></select>
      <input id="key" placeholder="key">
      <label><input type="checkbox" id="wire"> Show ciphertext (what the server sees)</label>
    </div>
    <div id="log"></div>
    <div id="typing"></div>
    <div id="preview"></div>
    <div class="send"><input id="text" placeholder="Type a message…" autocomplete="off"><button class="primary" id="send">Send</button></div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// Apply fn to letters only (keeps case, digits, punctuation, spaces)
function mapLetters(text, fn){
  return [...text].map(c=>{
    const u=c.toUpperCase(), i=A.indexOf(u);
    if(i<0) return c;
    const r=fn(i);
    return c===u ? r : r.toLowerCase();
  }).join('');
}
const mod = (n,m)=>((n%m)+m)%m;

function keyedAlphabet(word){
  const seen=[...(word.toUpperCase().replace(/[^A-Z]/g,'')+A)];
  return [...new Set(seen)].join('');
}
const CIPHERS = {
  caesar: {
    enc:(t,k)=>{const s=parseInt(k)||0; return mapLetters(t,i=>A[mod(i+s,26)]);},
    dec:(t,k)=>{const s=parseInt(k)||0; return mapLetters(t,i=>A[mod(i-s,26)]);}
  },
  vigenere: {
    enc:(t,k)=>vig(t,k,1), dec:(t,k)=>vig(t,k,-1)
  },
  mono: {
    enc:(t,k)=>{const K=keyedAlphabet(k); return mapLetters(t,i=>K[i]);},
    dec:(t,k)=>{const K=keyedAlphabet(k); return mapLetters(t,i=>A[K.indexOf(A[i])]);}
  }
};
function vig(t,k,sign){
  k=k.toUpperCase().replace(/[^A-Z]/g,'');
  if(!k) return t;
  let j=0;
  return mapLetters(t,i=>A[mod(i+sign*(k.charCodeAt(j++%k.length)-65),26)]);
}

const $=id=>document.getElementById(id);
const socket = io();
let me='';

$('join').onclick=()=>{
  me=$('name').value.trim();
  if(!me) return $('name').focus();
  $('cipher').value=$('cipherL').value;
  $('key').value=$('keyL').value;
  $('login').style.display='none';
  $('app').style.display='grid';
  socket.emit('join', me);
  $('text').focus();
};

function addMsg(user, plain, wireText, mine, t){
  const d=document.createElement('div');
  d.className='msg'+(mine?' me':'');
  const time=new Date(t||Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  d.innerHTML = (mine?'':'<div class="who"></div>')+'<div class="body"></div><div class="wire"></div><div class="time">'+time+'</div>';
  if(!mine) d.querySelector('.who').textContent=user;
  d.querySelector('.body').textContent=plain;
  d.querySelector('.wire').textContent='🔒 '+wireText;
  $('log').appendChild(d); $('log').scrollTop=1e9;
}
function addSys(t){
  const d=document.createElement('div'); d.className='sys'; d.textContent=t;
  $('log').appendChild(d); $('log').scrollTop=1e9;
}

function send(){
  const text=$('text').value; if(!text.trim()) return;
  const cipher=$('cipher').value, key=$('key').value;
  const ct=CIPHERS[cipher].enc(text,key);
  socket.emit('msg',{cipher,ct});
  addMsg(me,text,ct,true);
  $('text').value=''; $('preview').textContent='';
}
$('send').onclick=send;
$('text').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
let lastTyping=0;
$('text').addEventListener('input',()=>{
  const c=$('cipher').value,k=$('key').value;
  $('preview').textContent=$('text').value?'Encrypts to: '+CIPHERS[c].enc($('text').value,k):'';
  if(Date.now()-lastTyping>1500){socket.emit('typing');lastTyping=Date.now();}
});
$('key').addEventListener('input',()=>$('text').dispatchEvent(new Event('input')));
$('cipher').addEventListener('change',()=>$('text').dispatchEvent(new Event('input')));
$('wire').onchange=e=>document.body.classList.toggle('showwire',e.target.checked);

socket.on('msg',m=>{
  // Decrypt with MY cipher/key settings. Wrong key = gibberish, which is the point.
  const c=CIPHERS[$('cipher').value];
  addMsg(m.user,c.dec(m.ct,$('key').value),m.ct,false,m.t);
});
socket.on('system',addSys);
socket.on('users',list=>{
  $('users').innerHTML='';
  list.forEach(u=>{const d=document.createElement('div');d.className='user';d.textContent=u+(u===me?' (you)':'');$('users').appendChild(d);});
});
let tt;
socket.on('typing',u=>{
  $('typing').textContent=u+' is typing…';
  clearTimeout(tt); tt=setTimeout(()=>$('typing').textContent='',2000);
});
</script>
</body>
</html>
